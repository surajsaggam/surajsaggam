name: Update profile cards

on:
  schedule:
    - cron: "17 0 * * *"        # daily, 00:17 UTC
  workflow_dispatch:             # "Run workflow" button
  push:
    branches: [main]
    paths:
      - scripts/**
      - cards.config.json
      - codbeach.png
      - assets/**

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install fonttools pillow

      - name: Refresh contribution data
        run: python scripts/fetch_data.py
        env:
          # Public contributions only with the default token. For private ones,
          # add a PROFILE_TOKEN secret (a classic PAT with read:user).
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Render cards
        run: python scripts/build_cards.py

      - name: Commit data and cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
